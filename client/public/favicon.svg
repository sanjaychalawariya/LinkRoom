<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient matching the app's violet-to-indigo brand colors -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <!-- Subtle drop shadow for the icon itself -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#1e1b4b" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- Rounded squircle background -->
  <rect width="512" height="512" rx="144" fill="url(#bgGrad)" />
  
  <!-- Inner Chat Room / Link Icon centered -->
  <g filter="url(#dropShadow)" transform="translate(96, 96) scale(16)">
    <path 
      fill="#ffffff" 
      fill-rule="evenodd" 
      d="M18 10c0 3.866-3.582 7-8 7a8.841 8.841 0 01-4.083-.98L2 17l1.338-3.123C2.493 12.767 2 11.434 2 10c0-3.866 3.582-7 8-7s8 3.134 8 7zM7 9H5v2h2V9zm8 0h-2v2h2V9zM9 9h2v2H9V9z" 
      clip-rule="evenodd"
    />
  </g>
</svg>